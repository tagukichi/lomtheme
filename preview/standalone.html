<meta charset="utf-8">
<title>LOM Theme</title>
<style>
/* ---------------------------------------------------------------------------
   ビューアの外枠。中に映すテーマが主役なので、枠は徹底して静かに保つ。
   テーマのブランド色（#0097D7）は意図的に使わない。枠と中身が
   混ざって見えると、どこまでがテーマの意匠か判別できなくなる。
   --------------------------------------------------------------------------- */

:root {
  --shell-bg:     #eceef1;
  --shell-panel:  #ffffff;
  --shell-line:   #d6dae0;
  --shell-text:   #1b1f24;
  --shell-dim:    #5f6873;
  --shell-accent: #a96c12;
  --shell-shadow: 0 18px 48px rgba(20, 26, 34, 0.14);
  --shell-radius: 10px;
}

:root:not([data-theme="light"]) {
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --shell-bg:     #16191d;
    --shell-panel:  #21252b;
    --shell-line:   #333941;
    --shell-text:   #e7eaee;
    --shell-dim:    #8d959f;
    --shell-accent: #dda94b;
    --shell-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --shell-bg:     #16191d;
  --shell-panel:  #21252b;
  --shell-line:   #333941;
  --shell-text:   #e7eaee;
  --shell-dim:    #8d959f;
  --shell-accent: #dda94b;
  --shell-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--shell-bg);
  color: var(--shell-text);
  font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN",
               "Yu Gothic", "Meiryo", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

/* --- 上部バー ------------------------------------------------------------ */

.bar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 20px;
  padding: 12px 20px;
  background: var(--shell-panel);
  border-bottom: 1px solid var(--shell-line);
}

.bar__id {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-right: auto;
}

.bar__mark {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--shell-accent);
}

.bar__name {
  font-size: 13px;
  font-weight: 600;
}

.tabs,
.widths {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.tab,
.width {
  padding: 7px 13px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--shell-dim);
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}

.tab:hover,
.width:hover {
  background: color-mix(in srgb, var(--shell-text) 7%, transparent);
  color: var(--shell-text);
}

.tab[aria-selected="true"],
.width[aria-pressed="true"] {
  border-color: var(--shell-line);
  background: color-mix(in srgb, var(--shell-accent) 14%, transparent);
  color: var(--shell-text);
  font-weight: 600;
}

.tab:focus-visible,
.width:focus-visible {
  outline: 2px solid var(--shell-accent);
  outline-offset: 2px;
}

.widths {
  padding-left: 20px;
  border-left: 1px solid var(--shell-line);
}

/* --- ステージ ------------------------------------------------------------ */

.stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 22px 20px 56px;
}

.caption {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-size: 12.5px;
  color: var(--shell-dim);
}

.caption b {
  color: var(--shell-text);
  font-weight: 600;
}

.viewport {
  position: relative;
  transition: width 0.2s ease, height 0.2s ease;
}

.viewport iframe {
  display: block;
  width: 100%;
  border: 1px solid var(--shell-line);
  border-radius: var(--shell-radius);
  background: #fff;
  box-shadow: var(--shell-shadow);
  transform-origin: top left;
}

.note {
  max-width: 680px;
  margin: 0;
  padding: 14px 18px;
  border-left: 3px solid var(--shell-accent);
  border-radius: 0 8px 8px 0;
  background: var(--shell-panel);
  font-size: 12.5px;
  line-height: 1.85;
  color: var(--shell-dim);
}

.note b { color: var(--shell-text); }

@media (prefers-reduced-motion: reduce) {
  .viewport,
  .tab,
  .width { transition: none; }
}
</style>

<header class="bar">
  <div class="bar__id">
    <span class="bar__mark">LOM THEME</span>
    <span class="bar__name">プレビュー</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="画面を選ぶ"><button type="button" role="tab" class="tab" data-screen="front" aria-selected="false">トップ</button><button type="button" role="tab" class="tab" data-screen="page-activity" aria-selected="false">活動について</button><button type="button" role="tab" class="tab" data-screen="page-join" aria-selected="false">入会のご案内</button><button type="button" role="tab" class="tab" data-screen="page-greeting" aria-selected="false">理事長あいさつ</button><button type="button" role="tab" class="tab" data-screen="archive" aria-selected="false">一覧</button><button type="button" role="tab" class="tab" data-screen="single" aria-selected="false">記事</button><button type="button" role="tab" class="tab" data-screen="search" aria-selected="false">検索結果</button><button type="button" role="tab" class="tab" data-screen="404" aria-selected="false">404</button></nav>
  <div class="widths" role="group" aria-label="画面幅を変える">
    <button type="button" class="width" data-width="1280" aria-pressed="true">デスクトップ</button>
    <button type="button" class="width" data-width="834" aria-pressed="false">タブレット</button>
    <button type="button" class="width" data-width="390" aria-pressed="false">スマホ</button>
  </div>
</header>

<main class="stage">
  <p class="caption"><b id="caption-label"></b><span id="caption-note"></span></p>
  <div class="viewport" id="viewport">
    <iframe id="frame" title="テーマのプレビュー"></iframe>
  </div>
  <p class="note">
    <b>これはテーマの実テンプレートを実行して書き出した出力です。</b>
    静的HTMLを別途書いたものではないので、ここで見えているものが実際のテーマの出力です。
    画像はすべて生成したプレースホルダ、和文フォントは実サイトでは M PLUS 1 を読み込みます。
    分類タブのAJAX絞り込みだけはサーバーが必要なため動きません。
    メインビジュアルのスライダー、ハンバーガーメニュー、レスポンシブは動作します。
  </p>
</main>

<script type="application/json" id="screens">{"front":{"label":"トップ","note":"メインビジュアル・最新情報・紹介セクション","html":"\u003C!DOCTYPE html\u003E\n\u003Chtml lang=\"ja\"\u003E\n\u003Chead\u003E\n\t\u003Cmeta charset=\"UTF-8\"\u003E\n\t\u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003E\n\t\u003Ctitle\u003EHOME\u003C/title\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   デザイントークン + ベーススタイル\n\n   値は既存サイト（tamanojc.com）から抽出したものを踏襲。\n   各LOMでの色替えは :root の上書きだけで済むようにしてある。\n   =========================================================================== */\n\n:root {\n  /* ブランド ------------------------------------------------------------- */\n  --lom-brand:        #0097d7;\n  --lom-brand-dark:   #007cb0;\n  --lom-brand-tint:   rgba(0, 151, 215, 0.35);\n\n  /* テキスト ------------------------------------------------------------- */\n  --lom-heading:      #111111;\n  --lom-text:         #333333;\n  --lom-text-muted:   #666666;\n  --lom-text-subtle:  #999999;\n\n  /* 面 ------------------------------------------------------------------- */\n  --lom-bg:           #ffffff;\n  --lom-bg-muted:     #f2f2f2;\n  --lom-border:       #cccccc;\n\n  /* タイポグラフィ --------------------------------------------------------- */\n  --lom-font: \"M PLUS 1\", \"M PLUS 1p\", system-ui, -apple-system,\n              \"Hiragino Kaku Gothic ProN\", \"Meiryo\", sans-serif;\n\n  /* レイアウト ------------------------------------------------------------ */\n  --lom-content-width: 960px;\n  --lom-wide-width:   1200px;\n  --lom-gutter:       20px;\n\n  /* 装飾 ------------------------------------------------------------------ */\n  --lom-radius:       12px;\n  --lom-radius-lg:    14px;\n  --lom-shadow:       0 6px 16px rgba(0, 0, 0, 0.05);\n  --lom-shadow-card:  0 2px 14px rgba(0, 0, 0, 0.06);\n}\n\n/* リセット ------------------------------------------------------------- */\n\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--lom-bg);\n  color: var(--lom-text);\n  font-family: var(--lom-font);\n  font-size: 16px;\n  line-height: 1.8;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nimg,\npicture,\nvideo { max-width: 100%; height: auto; display: block; }\n\na {\n  color: var(--lom-brand);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\n/* フォーカスは必ず見えるようにする。既存サイトの focus 実装を踏襲。 */\n:focus-visible {\n  outline: 2px solid var(--lom-brand-tint);\n  outline-offset: 3px;\n}\n\n/* 見出し ---------------------------------------------------------------\n   レベルはテンプレート側で固定する。編集者に選ばせない。\n   ページタイトル = h1 / セクション = h2 / カード = h3\n   ---------------------------------------------------------------------- */\n\nh1, h2, h3, h4, h5, h6 {\n  color: var(--lom-heading);\n  font-weight: 700;\n  line-height: 1.35;\n  margin: 0;\n}\n\n/* ユーティリティ --------------------------------------------------------- */\n\n.lom-container {\n  width: 100%;\n  max-width: var(--lom-content-width);\n  margin-inline: auto;\n  padding-inline: var(--lom-gutter);\n}\n\n.lom-container--wide { max-width: var(--lom-wide-width); }\n\n.screen-reader-text {\n  position: absolute !important;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n  white-space: nowrap;\n  border: 0;\n}\n\n.screen-reader-text:focus {\n  position: static !important;\n  width: auto;\n  height: auto;\n  margin: 0;\n  padding: 12px 24px;\n  clip-path: none;\n  background: var(--lom-bg-muted);\n  color: var(--lom-heading);\n}\n\n.skip-link {\n  position: absolute;\n  top: -100px;\n  left: 8px;\n  z-index: 1000;\n  background: var(--lom-bg);\n  padding: 12px 20px;\n}\n.skip-link:focus { top: 8px; }\n\n/* ページの骨格 ----------------------------------------------------------- */\n\n.lom-page-title {\n  font-size: clamp(22px, 3.2vw, 30px);\n  text-align: center;\n  margin-block: 32px 28px;\n}\n\n/* サイドバーの有無で 1カラム / 2カラム を切り替える */\n.lom-layout {\n  display: grid;\n  gap: 32px;\n  align-items: start;\n  grid-template-columns: minmax(0, 1fr);\n}\n\n.lom-layout--with-sidebar {\n  grid-template-columns: minmax(0, 1fr) 280px;\n}\n\n@media (max-width: 900px) {\n  .lom-layout--with-sidebar { grid-template-columns: minmax(0, 1fr); }\n}\n\n.lom-main { min-width: 0; }\n\n/* パンくず --------------------------------------------------------------- */\n\n.lom-breadcrumb {\n  font-size: 12px;\n  color: var(--lom-text-muted);\n  padding-block: 12px;\n}\n.lom-breadcrumb ol {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n.lom-breadcrumb li::after {\n  content: \"\\003e\";\n  margin-inline-start: 6px;\n  color: var(--lom-border);\n}\n.lom-breadcrumb li:last-child::after { content: none; }\n.lom-breadcrumb a { color: var(--lom-text-muted); }\n\n/* 分類バッジ ------------------------------------------------------------\n   分類ごとの色は inc/template-tags.php の lomtheme_term_color() が\n   CSS変数 --badge で渡す。テーマ側で色を持たないので、LOMごとに\n   分類を増やしても破綻しない。\n   ---------------------------------------------------------------------- */\n\n.lom-badge {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 6px 9px;\n  border-radius: 3px;\n  font-size: 11px;\n  font-weight: 700;\n  line-height: 1;\n  letter-spacing: 0.02em;\n  white-space: nowrap;\n  color: #fff;\n  background: var(--badge, var(--lom-text-subtle));\n}\n\n.lom-badge--outline {\n  color: var(--badge, var(--lom-text-subtle));\n  background: #fff;\n  border: 2px solid currentColor;\n  border-radius: 10px;\n  padding: 6px 12px;\n}\n\n/* ページネーション ------------------------------------------------------- */\n\n.lom-pagination {\n  margin-top: 28px;\n  text-align: center;\n}\n\n.lom-pagination .page-numbers {\n  display: inline-block;\n  margin: 0 4px;\n  width: 32px;\n  height: 32px;\n  line-height: 30px;\n  text-align: center;\n  border: 1px solid var(--lom-border);\n  border-radius: 9999px;\n  font-size: 13px;\n  color: var(--lom-text-subtle);\n  text-decoration: none;\n}\n\n.lom-pagination .page-numbers.current {\n  background: var(--lom-brand);\n  border-color: var(--lom-brand);\n  color: #fff;\n}\n\n.lom-pagination a.page-numbers:hover {\n  border-color: var(--lom-brand);\n  color: var(--lom-brand);\n  text-decoration: none;\n}\n\n\u003C/style\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   ヘッダーとフッター\n   =========================================================================== */\n\n/* ヘッダー --------------------------------------------------------------- */\n\n.lom-header {\n  position: sticky;\n  top: 0;\n  z-index: 100;\n  background: var(--lom-bg);\n  border-bottom: 1px solid var(--lom-bg-muted);\n}\n\n.lom-header__inner {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  min-height: 64px;\n}\n\n.lom-header__brand img {\n  max-height: 44px;\n  width: auto;\n}\n\n.lom-header__title {\n  font-size: 17px;\n  font-weight: 700;\n  color: var(--lom-heading);\n  text-decoration: none;\n}\n\n.lom-header__actions {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n\n.lom-header__cta {\n  display: inline-flex;\n  align-items: center;\n  padding: 10px 22px;\n  border-radius: 6px;\n  background: #e8a33d;\n  color: #fff;\n  font-size: 14px;\n  font-weight: 700;\n  line-height: 1;\n  text-decoration: none;\n  transition: opacity 0.2s;\n}\n\n.lom-header__cta:hover { opacity: 0.88; color: #fff; text-decoration: none; }\n\n/* ハンバーガー ------------------------------------------------------------ */\n\n.lom-header__toggle {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 44px;\n  height: 44px;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  cursor: pointer;\n  color: var(--lom-heading);\n}\n\n.lom-header__toggle-bar,\n.lom-header__toggle-bar::before,\n.lom-header__toggle-bar::after {\n  display: block;\n  width: 24px;\n  height: 2px;\n  background: currentColor;\n  border-radius: 2px;\n  transition: transform 0.2s, opacity 0.2s;\n}\n\n.lom-header__toggle-bar { position: relative; }\n\n.lom-header__toggle-bar::before,\n.lom-header__toggle-bar::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n}\n\n.lom-header__toggle-bar::before { top: -7px; }\n.lom-header__toggle-bar::after  { top: 7px; }\n\n.lom-header__toggle[aria-expanded=\"true\"] .lom-header__toggle-bar {\n  background: transparent;\n}\n.lom-header__toggle[aria-expanded=\"true\"] .lom-header__toggle-bar::before {\n  transform: translateY(7px) rotate(45deg);\n}\n.lom-header__toggle[aria-expanded=\"true\"] .lom-header__toggle-bar::after {\n  transform: translateY(-7px) rotate(-45deg);\n}\n\n/* ドロワー --------------------------------------------------------------- */\n\n.lom-drawer {\n  border-top: 1px solid var(--lom-bg-muted);\n  background: var(--lom-bg);\n  padding-block: 20px;\n}\n\n.lom-drawer[hidden] { display: none; }\n\n.lom-drawer__menu {\n  list-style: none;\n  margin: 0 0 16px;\n  padding: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.lom-drawer__menu a {\n  display: block;\n  padding: 12px 4px;\n  border-bottom: 1px solid var(--lom-bg-muted);\n  color: var(--lom-heading);\n  font-weight: 700;\n  font-size: 15px;\n  text-decoration: none;\n}\n\n.lom-drawer__menu a:hover { color: var(--lom-brand); }\n\n/* 検索フォーム ------------------------------------------------------------ */\n\n.lom-search {\n  display: flex;\n  gap: 8px;\n}\n\n.lom-search__input {\n  flex: 1 1 auto;\n  min-width: 0;\n  padding: 10px 14px;\n  border: 1px solid var(--lom-border);\n  border-radius: 6px;\n  font-family: inherit;\n  font-size: 14px;\n}\n\n.lom-search__input:focus { border-color: var(--lom-brand); }\n\n.lom-search__submit {\n  flex: 0 0 auto;\n  padding: 10px 20px;\n  border: 0;\n  border-radius: 6px;\n  background: var(--lom-brand);\n  color: #fff;\n  font-family: inherit;\n  font-size: 14px;\n  font-weight: 700;\n  cursor: pointer;\n}\n\n.lom-search__submit:hover { opacity: 0.88; }\n\n/* フッター --------------------------------------------------------------- */\n\n.lom-footer {\n  margin-top: 64px;\n  background: var(--lom-bg-muted);\n}\n\n.lom-footer__inner {\n  display: grid;\n  grid-template-columns: auto minmax(0, 1fr) auto;\n  gap: 32px;\n  align-items: start;\n  padding-block: 40px;\n}\n\n.lom-footer__brand img { max-height: 56px; width: auto; }\n\n.lom-footer__address {\n  font-size: 12.5px;\n  line-height: 1.9;\n  color: var(--lom-text);\n}\n\n.lom-footer__address p { margin: 0 0 6px; }\n.lom-footer__address a { color: inherit; }\n\n.lom-footer__org { font-weight: 700; }\n\n.lom-footer__links {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 12px;\n}\n\n.lom-footer__social {\n  display: flex;\n  gap: 14px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n\n.lom-footer__social a {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 32px;\n  height: 32px;\n  color: var(--lom-brand);\n}\n\n/* アイコンはテーマにフォントを同梱せず、マスク画像で描く。\n   Font Awesome 等への依存を作らないための措置。 */\n.lom-icon {\n  display: block;\n  width: 20px;\n  height: 20px;\n  background: currentColor;\n  mask-repeat: no-repeat;\n  mask-position: center;\n  mask-size: contain;\n}\n\n.lom-icon--facebook { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M13.5%2021v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5%201.55-1.5H16.7V3.6c-.29-.04-1.27-.12-2.42-.12-2.4%200-4.03%201.46-4.03%204.15V9.9H7.5V13h2.75v8h3.25z%22%2F%3E%3C%2Fsvg%3E\"); }\n.lom-icon--instagram { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M12%202.2c3.2%200%203.6%200%204.85.07%201.17.05%201.8.25%202.23.41.56.22.96.48%201.38.9.42.42.68.82.9%201.38.16.42.36%201.06.41%202.23.06%201.25.07%201.63.07%204.81s-.01%203.56-.07%204.81c-.05%201.17-.25%201.8-.41%202.23-.22.56-.48.96-.9%201.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.25.06-1.63.07-4.85.07s-3.6-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23C2.21%2015.56%202.2%2015.18%202.2%2012s.01-3.56.07-4.81c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68%201.38-.9.42-.16%201.06-.36%202.23-.41C8.44%202.21%208.82%202.2%2012%202.2zm0%201.8c-3.13%200-3.5.01-4.73.07-.9.04-1.39.19-1.71.32-.43.17-.74.37-1.06.69-.32.32-.52.63-.69%201.06-.13.32-.28.81-.32%201.71C3.43%208.9%203.42%209.27%203.42%2012s.01%203.1.07%204.15c.04.9.19%201.39.32%201.71.17.43.37.74.69%201.06.32.32.63.52%201.06.69.32.13.81.28%201.71.32%201.23.06%201.6.07%204.73.07s3.5-.01%204.73-.07c.9-.04%201.39-.19%201.71-.32.43-.17.74-.37%201.06-.69.32-.32.52-.63.69-1.06.13-.32.28-.81.32-1.71.06-1.05.07-1.42.07-4.15s-.01-3.1-.07-4.15c-.04-.9-.19-1.39-.32-1.71a2.85%202.85%200%200%200-.69-1.06%202.85%202.85%200%200%200-1.06-.69c-.32-.13-.81-.28-1.71-.32C15.5%204.01%2015.13%204%2012%204zm0%203.03a4.97%204.97%200%201%201%200%209.94%204.97%204.97%200%200%201%200-9.94zm0%201.8a3.17%203.17%200%201%200%200%206.34%203.17%203.17%200%200%200%200-6.34zm6.33-2c0%20.64-.52%201.16-1.16%201.16a1.16%201.16%200%201%201%201.16-1.16z%22%2F%3E%3C%2Fsvg%3E\"); }\n.lom-icon--youtube { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M23%2012s0-3.5-.45-5.17a2.63%202.63%200%200%200-1.85-1.86C19.02%204.5%2012%204.5%2012%204.5s-7.02%200-8.7.47A2.63%202.63%200%200%200%201.45%206.83C1%208.5%201%2012%201%2012s0%203.5.45%205.17c.25.92.97%201.62%201.85%201.86%201.68.47%208.7.47%208.7.47s7.02%200%208.7-.47a2.63%202.63%200%200%200%201.85-1.86C23%2015.5%2023%2012%2023%2012zM9.75%2015.27V8.73L15.5%2012l-5.75%203.27z%22%2F%3E%3C%2Fsvg%3E\"); }\n.lom-icon--x { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M18.24%202.25h3.31l-7.23%208.26%208.5%2011.24h-6.65l-5.22-6.82-5.96%206.82H1.67l7.73-8.84L1.25%202.25h6.82l4.71%206.23%205.46-6.23zm-1.16%2017.52h1.83L7.01%204.13H5.05l12.03%2015.64z%22%2F%3E%3C%2Fsvg%3E\"); }\n\n.lom-footer__menu {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: flex-end;\n  gap: 8px 16px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n  font-size: 12.5px;\n}\n\n.lom-footer__menu a { color: var(--lom-text); }\n\n.lom-footer__copyright {\n  background: var(--lom-brand);\n  color: #fff;\n  padding-block: 10px;\n  font-size: 11.5px;\n  text-align: center;\n}\n\n@media (max-width: 900px) {\n  .lom-footer__inner { grid-template-columns: minmax(0, 1fr); gap: 20px; }\n  .lom-footer__links { align-items: flex-start; }\n  .lom-footer__menu { justify-content: flex-start; }\n}\n\n\u003C/style\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   アーカイブ：分類タブ + カードグリッド\n\n   既存サイトの jaycee-arc / jaycee-archive を統合したもの。\n   元の実装は Elementor の詳細度と戦うため全宣言に !important が付いていたが、\n   ページビルダーを使わないので不要になった。\n   =========================================================================== */\n\n/* 分類タブ --------------------------------------------------------------- */\n\n.lom-filter {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-bottom: 24px;\n}\n\n.lom-filter__tab {\n  display: inline-flex;\n  align-items: center;\n  padding: 8px 16px;\n  border: 1px solid var(--lom-border);\n  border-radius: 9999px;\n  font-size: 13px;\n  font-weight: 700;\n  line-height: 1;\n  color: var(--lom-text-muted);\n  background: var(--lom-bg);\n  cursor: pointer;\n  transition: color 0.2s, border-color 0.2s, background-color 0.2s;\n}\n\n.lom-filter__tab:hover {\n  border-color: var(--badge, var(--lom-brand));\n  color: var(--badge, var(--lom-brand));\n  text-decoration: none;\n}\n\n.lom-filter__tab.is-active {\n  background: var(--badge, var(--lom-brand));\n  border-color: var(--badge, var(--lom-brand));\n  color: #fff;\n}\n\n/* グリッド --------------------------------------------------------------- */\n\n.lom-grid {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 20px 30px;\n}\n\n@media (max-width: 1024px) {\n  .lom-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n\n@media (max-width: 767px) {\n  .lom-grid { gap: 18px 16px; }\n}\n\n/* カード ----------------------------------------------------------------- */\n\n.lom-card {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  overflow: hidden;\n  box-shadow: var(--lom-shadow);\n}\n\n.lom-card__link {\n  display: block;\n  color: inherit;\n  text-decoration: none;\n}\n\n.lom-card__link:hover { text-decoration: none; }\n.lom-card__link:hover .lom-card__title { text-decoration: underline; }\n\n.lom-card__thumb {\n  position: relative;\n  aspect-ratio: 3 / 4;\n  background: var(--lom-bg-muted);\n  overflow: hidden;\n}\n\n.lom-card__thumb img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.lom-thumb__placeholder {\n  display: block;\n  width: 100%;\n  height: 100%;\n  background: var(--lom-bg-muted);\n}\n\n/* サムネイル左下のバッジ */\n.lom-card__thumb .lom-badge {\n  position: absolute;\n  left: 12px;\n  bottom: 12px;\n  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);\n  pointer-events: none;\n}\n\n.lom-card__body { padding: 10px 12px 12px; }\n\n.lom-card .lom-date {\n  display: block;\n  font-size: 12px;\n  color: var(--lom-text-muted);\n  line-height: 1.6;\n}\n\n.lom-card__title {\n  margin: 0;\n  font-size: 15px;\n  font-weight: 700;\n  line-height: 1.5;\n  color: var(--lom-text);\n}\n\n@media (max-width: 767px) {\n  .lom-card__body { padding: 9px 10px 11px; }\n  .lom-card__title { font-size: 13px; }\n  .lom-card__thumb .lom-badge {\n    left: 10px;\n    bottom: 10px;\n    padding: 6px 8px;\n    font-size: 10.5px;\n  }\n}\n\n/* 状態表示 --------------------------------------------------------------- */\n\n.lom-archive__status {\n  padding: 12px 0;\n  font-size: 13px;\n  color: var(--lom-text-muted);\n}\n\n.lom-archive__count {\n  margin: 0 0 16px;\n  font-size: 13px;\n  color: var(--lom-text-muted);\n}\n\n.lom-archive.is-loading .lom-grid {\n  opacity: 0.4;\n  transition: opacity 0.2s;\n}\n\n.lom-empty {\n  padding: 40px 0;\n  text-align: center;\n  color: var(--lom-text-muted);\n}\n\n/* ボタン ----------------------------------------------------------------- */\n\n.lom-button {\n  display: inline-block;\n  padding: 12px 32px;\n  border-radius: 9999px;\n  background: var(--lom-brand);\n  color: #fff;\n  font-weight: 700;\n  font-size: 14px;\n  line-height: 1;\n  text-decoration: none;\n  transition: opacity 0.2s;\n}\n\n.lom-button:hover {\n  opacity: 0.88;\n  color: #fff;\n  text-decoration: none;\n}\n\n.lom-front-news { padding-block: 48px; }\n.lom-front-news__more { margin-top: 28px; text-align: center; }\n\n\u003C/style\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   フレキシブルコンテンツの各レイアウト\n\n   docs/03-page-layout-requirements.md の7種に対応。\n   =========================================================================== */\n\n.lom-blocks {\n  display: flex;\n  flex-direction: column;\n  gap: 40px;\n  padding-bottom: 56px;\n}\n\n/* 本文 ------------------------------------------------------------------- */\n\n.lom-prose {\n  font-size: 15px;\n  line-height: 1.9;\n  color: var(--lom-text);\n}\n\n.lom-prose \u003E :first-child { margin-top: 0; }\n.lom-prose \u003E :last-child { margin-bottom: 0; }\n\n.lom-prose p { margin-block: 0 1.2em; }\n.lom-prose a { text-decoration: underline; }\n\n.lom-prose ul,\n.lom-prose ol { padding-inline-start: 1.4em; margin-block: 0 1.2em; }\n\n.lom-prose img { margin-block: 1em; }\n\n.lom-prose--boxed {\n  border: 1px solid var(--lom-border);\n  border-radius: var(--lom-radius);\n  padding: 24px;\n  background: var(--lom-bg);\n}\n\n/* リード文 --------------------------------------------------------------- */\n\n.lom-lead {\n  margin: 0;\n  text-align: center;\n  font-size: clamp(17px, 2.4vw, 21px);\n  font-weight: 700;\n  line-height: 1.8;\n  color: var(--lom-heading);\n}\n\n/* ヒーロー画像 ----------------------------------------------------------- */\n\n.lom-hero {\n  margin: 0;\n  border-radius: var(--lom-radius);\n  overflow: hidden;\n  background: var(--lom-bg-muted);\n}\n\n.lom-hero img { width: 100%; }\n\n.lom-hero--wide img     { aspect-ratio: 16 / 9; object-fit: cover; }\n.lom-hero--standard img { aspect-ratio: 4 / 3;  object-fit: cover; }\n.lom-hero--portrait img { aspect-ratio: 3 / 4;  object-fit: cover; }\n.lom-hero--auto img     { aspect-ratio: auto; }\n\n.lom-hero__caption {\n  padding: 8px 4px 0;\n  font-size: 12px;\n  color: var(--lom-text-muted);\n  text-align: center;\n}\n\n/* 共通のセクション見出し --------------------------------------------------- */\n\n.lom-section__heading,\n.lom-info__heading {\n  font-size: clamp(18px, 2.6vw, 22px);\n  text-align: center;\n  margin-bottom: 20px;\n}\n\n/* セクション（見出し＋本文＋画像グリッド） ---------------------------------- */\n\n.lom-section {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 32px 28px;\n}\n\n.lom-section__body { margin-bottom: 22px; }\n\n.lom-gallery {\n  display: grid;\n  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));\n  gap: 12px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n\n.lom-gallery__item {\n  border-radius: 6px;\n  overflow: hidden;\n  background: var(--lom-bg-muted);\n}\n\n.lom-gallery__item img {\n  width: 100%;\n  aspect-ratio: 4 / 3;\n  object-fit: cover;\n}\n\n.lom-section__caption {\n  margin: 16px 0 0;\n  padding: 10px 14px;\n  border: 1px solid var(--lom-border);\n  border-radius: 6px;\n  background: var(--lom-bg-muted);\n  font-size: 12.5px;\n  color: var(--lom-text-muted);\n}\n\n@media (max-width: 767px) {\n  .lom-section { padding: 22px 16px; }\n  /* 4列は狭すぎるので2列に落とす */\n  .lom-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n\n/* カード（画像＋テキスト） -------------------------------------------------- */\n\n.lom-features {\n  display: flex;\n  flex-direction: column;\n  gap: 24px;\n}\n\n.lom-feature {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 28px;\n}\n\n.lom-feature__heading {\n  font-size: 18px;\n  text-align: center;\n  margin-bottom: 22px;\n  padding-bottom: 10px;\n  position: relative;\n}\n\n/* 見出し下の短いアクセント線 */\n.lom-feature__heading::after {\n  content: \"\";\n  position: absolute;\n  left: 50%;\n  bottom: 0;\n  transform: translateX(-50%);\n  width: 56px;\n  height: 2px;\n  background: var(--lom-brand);\n}\n\n.lom-feature__inner {\n  display: grid;\n  grid-template-columns: minmax(0, 240px) minmax(0, 1fr);\n  gap: 24px;\n  align-items: start;\n}\n\n.lom-feature--image-right .lom-feature__inner {\n  grid-template-columns: minmax(0, 1fr) minmax(0, 240px);\n}\n\n.lom-feature--image-right .lom-feature__media { order: 2; }\n\n.lom-feature__media img {\n  width: 100%;\n  border-radius: 6px;\n}\n\n@media (max-width: 767px) {\n  .lom-feature { padding: 20px 16px; }\n  .lom-feature__inner,\n  .lom-feature--image-right .lom-feature__inner {\n    grid-template-columns: minmax(0, 1fr);\n  }\n  .lom-feature--image-right .lom-feature__media { order: 0; }\n}\n\n/* 箇条書きボックス --------------------------------------------------------- */\n\n.lom-boxes {\n  display: grid;\n  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));\n  gap: 20px;\n}\n\n.lom-box {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 24px;\n}\n\n.lom-box__heading {\n  font-size: 16px;\n  text-align: center;\n  margin-bottom: 16px;\n  padding-bottom: 10px;\n  border-bottom: 2px solid var(--lom-brand);\n}\n\n.lom-box__list {\n  margin: 0;\n  padding-inline-start: 1.3em;\n  font-size: 14px;\n  line-height: 1.9;\n}\n\n@media (max-width: 767px) {\n  .lom-boxes { grid-template-columns: minmax(0, 1fr); }\n}\n\n/* 案内ボックス ------------------------------------------------------------ */\n\n.lom-info {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 28px;\n}\n\n.lom-info__list {\n  margin: 0 0 18px;\n  padding-inline-start: 1.5em;\n  font-size: 14px;\n  line-height: 1.9;\n}\n\n.lom-info__note {\n  font-size: 14px;\n}\n\n@media (max-width: 767px) {\n  .lom-info { padding: 20px 16px; }\n}\n\n\u003C/style\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   メインビジュアル・スライダー（既存サイトの mvts 相当）\n   =========================================================================== */\n\n.lom-mv {\n  position: relative;\n  margin-bottom: 8px;\n}\n\n.lom-mv__viewport {\n  position: relative;\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  overflow: hidden;\n  background: var(--lom-bg-muted);\n}\n\n.lom-mv__slide {\n  position: absolute;\n  inset: 0;\n  opacity: 0;\n  visibility: hidden;\n  transition: opacity 0.5s ease;\n}\n\n.lom-mv__slide.is-active {\n  opacity: 1;\n  visibility: visible;\n}\n\n.lom-mv__slide img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n/* ドット ----------------------------------------------------------------- */\n\n/* 明るい写真の上でも見えるよう、ドットの背後に薄い暗幕を敷く。\n   白いドットだけだと淡色の画像で完全に埋もれる。 */\n.lom-mv__dots {\n  position: absolute;\n  left: 50%;\n  bottom: 14px;\n  z-index: 2;\n  transform: translateX(-50%);\n  display: flex;\n  gap: 8px;\n  padding: 7px 12px;\n  border-radius: 9999px;\n  background: rgba(0, 0, 0, 0.32);\n}\n\n.lom-mv__dot {\n  width: 10px;\n  height: 10px;\n  padding: 0;\n  border: 0;\n  border-radius: 50%;\n  background: rgba(255, 255, 255, 0.55);\n  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);\n  cursor: pointer;\n  transition: background-color 0.2s;\n}\n\n.lom-mv__dot.is-active { background: #fff; }\n\n/* サムネイル -------------------------------------------------------------- */\n\n.lom-mv__thumbs {\n  display: flex;\n  justify-content: center;\n  gap: 8px;\n  padding: 10px 0;\n  flex-wrap: wrap;\n}\n\n.lom-mv__thumb {\n  width: 72px;\n  aspect-ratio: 16 / 9;\n  padding: 0;\n  border: 2px solid transparent;\n  border-radius: 4px;\n  overflow: hidden;\n  background: var(--lom-bg-muted);\n  cursor: pointer;\n  opacity: 0.6;\n  transition: opacity 0.2s, border-color 0.2s;\n}\n\n.lom-mv__thumb img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.lom-mv__thumb:hover { opacity: 0.85; }\n\n.lom-mv__thumb.is-active {\n  opacity: 1;\n  border-color: var(--lom-brand);\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .lom-mv__slide { transition: none; }\n}\n\n@media (max-width: 767px) {\n  .lom-mv__viewport { aspect-ratio: 4 / 3; }\n  .lom-mv__thumb { width: 56px; }\n}\n\n\u003C/style\u003E\n\u003C/head\u003E\n\n\u003Cbody class=\"front_page page singular\"\u003E\u003Ca class=\"skip-link screen-reader-text\" href=\"#lom-content\"\u003E\n\tコンテンツにスキップ\u003C/a\u003E\n\n\u003Cheader class=\"lom-header\"\u003E\n\t\u003Cdiv class=\"lom-header__inner lom-container lom-container--wide\"\u003E\n\n\t\t\u003Cdiv class=\"lom-header__brand\"\u003E\n\t\t\t\t\t\t\t\u003Ca href=\"index.html\" class=\"custom-logo-link\"\u003E\u003Cimg class=\"custom-logo\" src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22268%22%20height%3D%22122%22%20viewBox%3D%220%200%20268%20122%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22hsl%28200%2042%25%2084%25%29%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-family%3D%22sans-serif%22%20font-size%3D%2213%22%20fill%3D%22hsl%28200%2038%25%2030%25%29%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3EJCI%20LOGO%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"一般社団法人サンプル青年会議所\"\u003E\u003C/a\u003E\t\t\t\t\t\u003C/div\u003E\n\n\t\t\u003Cdiv class=\"lom-header__actions\"\u003E\n\t\t\t\t\t\t\t\u003Ca class=\"lom \t}\n\t} );\n}() );\n\n\u003C/script\u003E\n\u003Cscript\u003E\n/**\n * メインビジュアル・スライダー\n *\n * 依存ライブラリなし。スライドが1枚のときは何もしない。\n * ユーザーが動きを減らす設定にしている場合は自動送りしない。\n */\n( function () {\n\t'use strict';\n\n\tvar root = document.querySelector( '[data-lom-mv]' );\n\tif ( ! root ) {\n\t\treturn;\n\t}\n\n\tvar slides = root.querySelectorAll( '.lom-mv__slide' );\n\tif ( slides.length \u003C 2 ) {\n\t\treturn;\n\t}\n\n\tvar dots = root.querySelectorAll( '.lom-mv__dot' );\n\tvar thumbs = root.querySelectorAll( '.lom-mv__thumb' );\n\tvar current = 0;\n\tvar timer = null;\n\tvar INTERVAL = 6000;\n\n\tvar reduceMotion = window.matchMedia \u0026\u0026\n\t\twindow.matchMedia( '(prefers-reduced-motion: reduce)' ).matches;\n\n\tfunction apply( collection, index, attr ) {\n\t\tArray.prototype.forEach.call( collection, function ( node, i ) {\n\t\t\tvar active = i === index;\n\t\t\tnode.classList.toggle( 'is-active', active );\n\t\t\tif ( attr ) {\n\t\t\t\tnode.setAttribute( attr, active ? 'true' : 'false' );\n\t\t\t}\n\t\t} );\n\t}\n\n\tfunction goto( index ) {\n\t\tcurrent = ( index + slides.length ) % slides.length;\n\n\t\tArray.prototype.forEach.call( slides, function ( slide, i ) {\n\t\t\tvar active = i === current;\n\t\t\tslide.classList.toggle( 'is-active', active );\n\t\t\tif ( active ) {\n\t\t\t\tslide.removeAttribute( 'aria-hidden' );\n\t\t\t} else {\n\t\t\t\tslide.setAttribute( 'aria-hidden', 'true' );\n\t\t\t}\n\t\t} );\n\n\t\tapply( dots, current, 'aria-selected' );\n\t\tapply( thumbs, current, null );\n\t}\n\n\tfunction start() {\n\t\tif ( reduceMotion || timer ) {\n\t\t\treturn;\n\t\t}\n\t\ttimer = window.setInterval( function () {\n\t\t\tgoto( current + 1 );\n\t\t}, INTERVAL );\n\t}\n\n\tfunction stop() {\n\t\tif ( ! timer ) {\n\t\t\treturn;\n\t\t}\n\t\twindow.clearInterval( timer );\n\t\ttimer = null;\n\t}\n\n\troot.querySelectorAll( '[data-lom-mv-goto]' ).forEach( function ( button ) {\n\t\tbutton.addEventListener( 'click', function () {\n\t\t\tgoto( parseInt( button.getAttribute( 'data-lom-mv-goto' ), 10 ) || 0 );\n\t\t\t// 操作されたら自動送りは止める。勝手に動くと使いにくい。\n\t\t\tstop();\n\t\t} );\n\t} );\n\n\troot.addEventListener( 'mouseenter', stop );\n\troot.addEventListener( 'mouseleave', start );\n\troot.addEventListener( 'focusin', stop );\n\n\t// 別タブに移っている間は動かさない。\n\tdocument.addEventListener( 'visibilitychange', function () {\n\t\tif ( document.hidden ) {\n\t\t\tstop();\n\t\t} else {\n\t\t\tstart();\n\t\t}\n\t} );\n\n\tstart();\n}() );\n\n\u003C/script\u003E\n\u003Cscript\u003E\n/**\n * 分類タブの絞り込み\n *\n * タブは通常のリンクとして書かれているので、この JS が読み込まれ\n * なくてもカテゴリーアーカイブへ遷移して機能する。ここでは\n * ページ遷移を AJAX に置き換えて体験を良くしているだけ。\n */\n( function () {\n\t'use strict';\n\n\tvar config = window.lomthemeArchive;\n\tif ( ! config ) {\n\t\treturn;\n\t}\n\n\tvar root = document.querySelector( '[data-lom-archive]' );\n\tvar tabs = document.querySelectorAll( '.lom-filter__tab' );\n\tif ( ! root || ! tabs.length ) {\n\t\treturn;\n\t}\n\n\tvar grid = root.querySelector( '[data-lom-grid]' );\n\tvar status = root.querySelector( '[data-lom-status]' );\n\tvar pagination = root.querySelector( '.lom-pagination' );\n\tvar inFlight = null;\n\n\tfunction setStatus( message ) {\n\t\tif ( ! status ) {\n\t\t\treturn;\n\t\t}\n\t\tstatus.textContent = message || '';\n\t\tstatus.hidden = ! message;\n\t}\n\n\tfunction setActive( tab ) {\n\t\tArray.prototype.forEach.call( tabs, function ( item ) {\n\t\t\tvar active = item === tab;\n\t\t\titem.classList.toggle( 'is-active', active );\n\t\t\tif ( active ) {\n\t\t\t\titem.setAttribute( 'aria-current', 'page' );\n\t\t\t} else {\n\t\t\t\titem.removeAttribute( 'aria-current' );\n\t\t\t}\n\t\t} );\n\t}\n\n\tfunction load( tab ) {\n\t\tvar term = tab.getAttribute( 'data-term' ) || '';\n\n\t\tif ( inFlight ) {\n\t\t\tinFlight.abort();\n\t\t}\n\t\tinFlight = new AbortController();\n\n\t\troot.classList.add( 'is-loading' );\n\t\tsetStatus( config.loading );\n\n\t\tvar body = new URLSearchParams();\n\t\tbody.set( 'action', config.action );\n\t\tbody.set( 'nonce', config.nonce );\n\t\tbody.set( 'term', term );\n\t\tbody.set( 'paged', '1' );\n\n\t\tfetch( config.endpoint, {\n\t\t\tmethod: 'POST',\n\t\t\tcredentials: 'same-origin',\n\t\t\theaders: { 'Content-Type': 'application/x-www-form-urlencoded' },\n\t\t\tbody: body.toString(),\n\t\t\tsignal: inFlight.signal\n\t\t} )\n\t\t\t.then( function ( response ) {\n\t\t\t\tif ( ! response.ok ) {\n\t\t\t\t\tthrow new Error( 'HTTP ' + response.status );\n\t\t\t\t}\n\t\t\t\treturn response.json();\n\t\t\t} )\n\t\t\t.then( function ( payload ) {\n\t\t\t\tif ( ! payload || ! payload.success ) {\n\t\t\t\t\tthrow new Error( 'unexpected payload' );\n\t\t\t\t}\n\n\t\t\t\tgrid.innerHTML = payload.data.html ||\n\t\t\t\t\t'\u003Cp class=\"lom-empty\"\u003E' + config.empty + '\u003C/p\u003E';\n\n\t\t\t\t// 絞り込み結果は1ページ目のみを出すので、\n\t\t\t\t// 元のページ送りは意味を失う。消しておく。\n\t\t\t\tif ( pagination ) {\n\t\t\t\t\tpagination.hidden = true;\n\t\t\t\t}\n\n\t\t\t\tsetActive( tab );\n\t\t\t\tsetStatus( '' );\n\n\t\t\t\t// URL を更新しておくと、再読み込みや共有で同じ状態に戻れる。\n\t\t\t\tif ( window.history \u0026\u0026 window.history.replaceState ) {\n\t\t\t\t\twindow.history.replaceState( null, '', tab.href );\n\t\t\t\t}\n\t\t\t} )\n\t\t\t.catch( function ( error ) {\n\t\t\t\tif ( 'AbortError' === error.name ) {\n\t\t\t\t\treturn;\n\t\t\t\t}\n\t\t\t\tsetStatus( config.error );\n\t\t\t} )\n\t\t\t.finally( function () {\n\t\t\t\troot.classList.remove( 'is-loading' );\n\t\t\t\tinFlight = null;\n\t\t\t} );\n\t}\n\n\tArray.prototype.forEach.call( tabs, function ( tab ) {\n\t\ttab.addEventListener( 'click', function ( event ) {\n\t\t\t// 修飾キー付きクリックや中クリックは通常の遷移に任せる。\n\t\t\tif ( event.metaKey || event.ctrlKey || event.shiftKey || 1 !== event.which ) {\n\t\t\t\treturn;\n\t\t\t}\n\t\t\tevent.preventDefault();\n\t\t\tload( tab );\n\t\t} );\n\t} );\n}() );\n\n\u003C/script\u003E\n\u003C/body\u003E\n\u003C/html\u003E\n"},"page-activity":{"label":"活動について","note":"セクションの繰り返しで組む固定ページ","html":"\u003C!DOCTYPE html\u003E\n\u003Chtml lang=\"ja\"\u003E\n\u003Chead\u003E\n\t\u003Cmeta charset=\"UTF-8\"\u003E\n\t\u003Cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003E\n\t\u003Ctitle\u003E活動について\u003C/title\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   デザイントークン + ベーススタイル\n\n   値は既存サイト（tamanojc.com）から抽出したものを踏襲。\n   各LOMでの色替えは :root の上書きだけで済むようにしてある。\n   =========================================================================== */\n\n:root {\n  /* ブランド ------------------------------------------------------------- */\n  --lom-brand:        #0097d7;\n  --lom-brand-dark:   #007cb0;\n  --lom-brand-tint:   rgba(0, 151, 215, 0.35);\n\n  /* テキスト ------------------------------------------------------------- */\n  --lom-heading:      #111111;\n  --lom-text:         #333333;\n  --lom-text-muted:   #666666;\n  --lom-text-subtle:  #999999;\n\n  /* 面 ------------------------------------------------------------------- */\n  --lom-bg:           #ffffff;\n  --lom-bg-muted:     #f2f2f2;\n  --lom-border:       #cccccc;\n\n  /* タイポグラフィ --------------------------------------------------------- */\n  --lom-font: \"M PLUS 1\", \"M PLUS 1p\", system-ui, -apple-system,\n              \"Hiragino Kaku Gothic ProN\", \"Meiryo\", sans-serif;\n\n  /* レイアウト ------------------------------------------------------------ */\n  --lom-content-width: 960px;\n  --lom-wide-width:   1200px;\n  --lom-gutter:       20px;\n\n  /* 装飾 ------------------------------------------------------------------ */\n  --lom-radius:       12px;\n  --lom-radius-lg:    14px;\n  --lom-shadow:       0 6px 16px rgba(0, 0, 0, 0.05);\n  --lom-shadow-card:  0 2px 14px rgba(0, 0, 0, 0.06);\n}\n\n/* リセット ------------------------------------------------------------- */\n\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--lom-bg);\n  color: var(--lom-text);\n  font-family: var(--lom-font);\n  font-size: 16px;\n  line-height: 1.8;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nimg,\npicture,\nvideo { max-width: 100%; height: auto; display: block; }\n\na {\n  color: var(--lom-brand);\n  text-decoration: none;\n}\na:hover { text-decoration: underline; }\n\n/* フォーカスは必ず見えるようにする。既存サイトの focus 実装を踏襲。 */\n:focus-visible {\n  outline: 2px solid var(--lom-brand-tint);\n  outline-offset: 3px;\n}\n\n/* 見出し ---------------------------------------------------------------\n   レベルはテンプレート側で固定する。編集者に選ばせない。\n   ページタイトル = h1 / セクション = h2 / カード = h3\n   ---------------------------------------------------------------------- */\n\nh1, h2, h3, h4, h5, h6 {\n  color: var(--lom-heading);\n  font-weight: 700;\n  line-height: 1.35;\n  margin: 0;\n}\n\n/* ユーティリティ --------------------------------------------------------- */\n\n.lom-container {\n  width: 100%;\n  max-width: var(--lom-content-width);\n  margin-inline: auto;\n  padding-inline: var(--lom-gutter);\n}\n\n.lom-container--wide { max-width: var(--lom-wide-width); }\n\n.screen-reader-text {\n  position: absolute !important;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip-path: inset(50%);\n  white-space: nowrap;\n  border: 0;\n}\n\n.screen-reader-text:focus {\n  position: static !important;\n  width: auto;\n  height: auto;\n  margin: 0;\n  padding: 12px 24px;\n  clip-path: none;\n  background: var(--lom-bg-muted);\n  color: var(--lom-heading);\n}\n\n.skip-link {\n  position: absolute;\n  top: -100px;\n  left: 8px;\n  z-index: 1000;\n  background: var(--lom-bg);\n  padding: 12px 20px;\n}\n.skip-link:focus { top: 8px; }\n\n/* ページの骨格 ----------------------------------------------------------- */\n\n.lom-page-title {\n  font-size: clamp(22px, 3.2vw, 30px);\n  text-align: center;\n  margin-block: 32px 28px;\n}\n\n/* サイドバーの有無で 1カラム / 2カラム を切り替える */\n.lom-layout {\n  display: grid;\n  gap: 32px;\n  align-items: start;\n  grid-template-columns: minmax(0, 1fr);\n}\n\n.lom-layout--with-sidebar {\n  grid-template-columns: minmax(0, 1fr) 280px;\n}\n\n@media (max-width: 900px) {\n  .lom-layout--with-sidebar { grid-template-columns: minmax(0, 1fr); }\n}\n\n.lom-main { min-width: 0; }\n\n/* パンくず --------------------------------------------------------------- */\n\n.lom-breadcrumb {\n  font-size: 12px;\n  color: var(--lom-text-muted);\n  padding-block: 12px;\n}\n.lom-breadcrumb ol {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 6px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n.lom-breadcrumb li::after {\n  content: \"\\003e\";\n  margin-inline-start: 6px;\n  color: var(--lom-border);\n}\n.lom-breadcrumb li:last-child::after { content: none; }\n.lom-breadcrumb a { color: var(--lom-text-muted); }\n\n/* 分類バッジ ------------------------------------------------------------\n   分類ごとの色は inc/template-tags.php の lomtheme_term_color() が\n   CSS変数 --badge で渡す。テーマ側で色を持たないので、LOMごとに\n   分類を増やしても破綻しない。\n   ---------------------------------------------------------------------- */\n\n.lom-badge {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  padding: 6px 9px;\n  border-radius: 3px;\n  font-size: 11px;\n  font-weight: 700;\n  line-height: 1;\n  letter-spacing: 0.02em;\n  white-space: nowrap;\n  color: #fff;\n  background: var(--badge, var(--lom-text-subtle));\n}\n\n.lom-badge--outline {\n  color: var(--badge, var(--lom-text-subtle));\n  background: #fff;\n  border: 2px solid currentColor;\n  border-radius: 10px;\n  padding: 6px 12px;\n}\n\n/* ページネーション ------------------------------------------------------- */\n\n.lom-pagination {\n  margin-top: 28px;\n  text-align: center;\n}\n\n.lom-pagination .page-numbers {\n  display: inline-block;\n  margin: 0 4px;\n  width: 32px;\n  height: 32px;\n  line-height: 30px;\n  text-align: center;\n  border: 1px solid var(--lom-border);\n  border-radius: 9999px;\n  font-size: 13px;\n  color: var(--lom-text-subtle);\n  text-decoration: none;\n}\n\n.lom-pagination .page-numbers.current {\n  background: var(--lom-brand);\n  border-color: var(--lom-brand);\n  color: #fff;\n}\n\n.lom-pagination a.page-numbers:hover {\n  border-color: var(--lom-brand);\n  color: var(--lom-brand);\n  text-decoration: none;\n}\n\n\u003C/style\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   ヘッダーとフッター\n   =========================================================================== */\n\n/* ヘッダー --------------------------------------------------------------- */\n\n.lom-header {\n  position: sticky;\n  top: 0;\n  z-index: 100;\n  background: var(--lom-bg);\n  border-bottom: 1px solid var(--lom-bg-muted);\n}\n\n.lom-header__inner {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  min-height: 64px;\n}\n\n.lom-header__brand img {\n  max-height: 44px;\n  width: auto;\n}\n\n.lom-header__title {\n  font-size: 17px;\n  font-weight: 700;\n  color: var(--lom-heading);\n  text-decoration: none;\n}\n\n.lom-header__actions {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n\n.lom-header__cta {\n  display: inline-flex;\n  align-items: center;\n  padding: 10px 22px;\n  border-radius: 6px;\n  background: #e8a33d;\n  color: #fff;\n  font-size: 14px;\n  font-weight: 700;\n  line-height: 1;\n  text-decoration: none;\n  transition: opacity 0.2s;\n}\n\n.lom-header__cta:hover { opacity: 0.88; color: #fff; text-decoration: none; }\n\n/* ハンバーガー ------------------------------------------------------------ */\n\n.lom-header__toggle {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 44px;\n  height: 44px;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  cursor: pointer;\n  color: var(--lom-heading);\n}\n\n.lom-header__toggle-bar,\n.lom-header__toggle-bar::before,\n.lom-header__toggle-bar::after {\n  display: block;\n  width: 24px;\n  height: 2px;\n  background: currentColor;\n  border-radius: 2px;\n  transition: transform 0.2s, opacity 0.2s;\n}\n\n.lom-header__toggle-bar { position: relative; }\n\n.lom-header__toggle-bar::before,\n.lom-header__toggle-bar::after {\n  content: \"\";\n  position: absolute;\n  left: 0;\n}\n\n.lom-header__toggle-bar::before { top: -7px; }\n.lom-header__toggle-bar::after  { top: 7px; }\n\n.lom-header__toggle[aria-expanded=\"true\"] .lom-header__toggle-bar {\n  background: transparent;\n}\n.lom-header__toggle[aria-expanded=\"true\"] .lom-header__toggle-bar::before {\n  transform: translateY(7px) rotate(45deg);\n}\n.lom-header__toggle[aria-expanded=\"true\"] .lom-header__toggle-bar::after {\n  transform: translateY(-7px) rotate(-45deg);\n}\n\n/* ドロワー --------------------------------------------------------------- */\n\n.lom-drawer {\n  border-top: 1px solid var(--lom-bg-muted);\n  background: var(--lom-bg);\n  padding-block: 20px;\n}\n\n.lom-drawer[hidden] { display: none; }\n\n.lom-drawer__menu {\n  list-style: none;\n  margin: 0 0 16px;\n  padding: 0;\n  display: flex;\n  flex-direction: column;\n  gap: 2px;\n}\n\n.lom-drawer__menu a {\n  display: block;\n  padding: 12px 4px;\n  border-bottom: 1px solid var(--lom-bg-muted);\n  color: var(--lom-heading);\n  font-weight: 700;\n  font-size: 15px;\n  text-decoration: none;\n}\n\n.lom-drawer__menu a:hover { color: var(--lom-brand); }\n\n/* 検索フォーム ------------------------------------------------------------ */\n\n.lom-search {\n  display: flex;\n  gap: 8px;\n}\n\n.lom-search__input {\n  flex: 1 1 auto;\n  min-width: 0;\n  padding: 10px 14px;\n  border: 1px solid var(--lom-border);\n  border-radius: 6px;\n  font-family: inherit;\n  font-size: 14px;\n}\n\n.lom-search__input:focus { border-color: var(--lom-brand); }\n\n.lom-search__submit {\n  flex: 0 0 auto;\n  padding: 10px 20px;\n  border: 0;\n  border-radius: 6px;\n  background: var(--lom-brand);\n  color: #fff;\n  font-family: inherit;\n  font-size: 14px;\n  font-weight: 700;\n  cursor: pointer;\n}\n\n.lom-search__submit:hover { opacity: 0.88; }\n\n/* フッター --------------------------------------------------------------- */\n\n.lom-footer {\n  margin-top: 64px;\n  background: var(--lom-bg-muted);\n}\n\n.lom-footer__inner {\n  display: grid;\n  grid-template-columns: auto minmax(0, 1fr) auto;\n  gap: 32px;\n  align-items: start;\n  padding-block: 40px;\n}\n\n.lom-footer__brand img { max-height: 56px; width: auto; }\n\n.lom-footer__address {\n  font-size: 12.5px;\n  line-height: 1.9;\n  color: var(--lom-text);\n}\n\n.lom-footer__address p { margin: 0 0 6px; }\n.lom-footer__address a { color: inherit; }\n\n.lom-footer__org { font-weight: 700; }\n\n.lom-footer__links {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-end;\n  gap: 12px;\n}\n\n.lom-footer__social {\n  display: flex;\n  gap: 14px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n\n.lom-footer__social a {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 32px;\n  height: 32px;\n  color: var(--lom-brand);\n}\n\n/* アイコンはテーマにフォントを同梱せず、マスク画像で描く。\n   Font Awesome 等への依存を作らないための措置。 */\n.lom-icon {\n  display: block;\n  width: 20px;\n  height: 20px;\n  background: currentColor;\n  mask-repeat: no-repeat;\n  mask-position: center;\n  mask-size: contain;\n}\n\n.lom-icon--facebook { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M13.5%2021v-8h2.7l.4-3.1h-3.1V7.9c0-.9.25-1.5%201.55-1.5H16.7V3.6c-.29-.04-1.27-.12-2.42-.12-2.4%200-4.03%201.46-4.03%204.15V9.9H7.5V13h2.75v8h3.25z%22%2F%3E%3C%2Fsvg%3E\"); }\n.lom-icon--instagram { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M12%202.2c3.2%200%203.6%200%204.85.07%201.17.05%201.8.25%202.23.41.56.22.96.48%201.38.9.42.42.68.82.9%201.38.16.42.36%201.06.41%202.23.06%201.25.07%201.63.07%204.81s-.01%203.56-.07%204.81c-.05%201.17-.25%201.8-.41%202.23-.22.56-.48.96-.9%201.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.25.06-1.63.07-4.85.07s-3.6-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41-.56-.22-.96-.48-1.38-.9-.42-.42-.68-.82-.9-1.38-.16-.42-.36-1.06-.41-2.23C2.21%2015.56%202.2%2015.18%202.2%2012s.01-3.56.07-4.81c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68%201.38-.9.42-.16%201.06-.36%202.23-.41C8.44%202.21%208.82%202.2%2012%202.2zm0%201.8c-3.13%200-3.5.01-4.73.07-.9.04-1.39.19-1.71.32-.43.17-.74.37-1.06.69-.32.32-.52.63-.69%201.06-.13.32-.28.81-.32%201.71C3.43%208.9%203.42%209.27%203.42%2012s.01%203.1.07%204.15c.04.9.19%201.39.32%201.71.17.43.37.74.69%201.06.32.32.63.52%201.06.69.32.13.81.28%201.71.32%201.23.06%201.6.07%204.73.07s3.5-.01%204.73-.07c.9-.04%201.39-.19%201.71-.32.43-.17.74-.37%201.06-.69.32-.32.52-.63.69-1.06.13-.32.28-.81.32-1.71.06-1.05.07-1.42.07-4.15s-.01-3.1-.07-4.15c-.04-.9-.19-1.39-.32-1.71a2.85%202.85%200%200%200-.69-1.06%202.85%202.85%200%200%200-1.06-.69c-.32-.13-.81-.28-1.71-.32C15.5%204.01%2015.13%204%2012%204zm0%203.03a4.97%204.97%200%201%201%200%209.94%204.97%204.97%200%200%201%200-9.94zm0%201.8a3.17%203.17%200%201%200%200%206.34%203.17%203.17%200%200%200%200-6.34zm6.33-2c0%20.64-.52%201.16-1.16%201.16a1.16%201.16%200%201%201%201.16-1.16z%22%2F%3E%3C%2Fsvg%3E\"); }\n.lom-icon--youtube { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M23%2012s0-3.5-.45-5.17a2.63%202.63%200%200%200-1.85-1.86C19.02%204.5%2012%204.5%2012%204.5s-7.02%200-8.7.47A2.63%202.63%200%200%200%201.45%206.83C1%208.5%201%2012%201%2012s0%203.5.45%205.17c.25.92.97%201.62%201.85%201.86%201.68.47%208.7.47%208.7.47s7.02%200%208.7-.47a2.63%202.63%200%200%200%201.85-1.86C23%2015.5%2023%2012%2023%2012zM9.75%2015.27V8.73L15.5%2012l-5.75%203.27z%22%2F%3E%3C%2Fsvg%3E\"); }\n.lom-icon--x { mask-image: url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M18.24%202.25h3.31l-7.23%208.26%208.5%2011.24h-6.65l-5.22-6.82-5.96%206.82H1.67l7.73-8.84L1.25%202.25h6.82l4.71%206.23%205.46-6.23zm-1.16%2017.52h1.83L7.01%204.13H5.05l12.03%2015.64z%22%2F%3E%3C%2Fsvg%3E\"); }\n\n.lom-footer__menu {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: flex-end;\n  gap: 8px 16px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n  font-size: 12.5px;\n}\n\n.lom-footer__menu a { color: var(--lom-text); }\n\n.lom-footer__copyright {\n  background: var(--lom-brand);\n  color: #fff;\n  padding-block: 10px;\n  font-size: 11.5px;\n  text-align: center;\n}\n\n@media (max-width: 900px) {\n  .lom-footer__inner { grid-template-columns: minmax(0, 1fr); gap: 20px; }\n  .lom-footer__links { align-items: flex-start; }\n  .lom-footer__menu { justify-content: flex-start; }\n}\n\n\u003C/style\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   サイドバー「最新情報」（既存サイトの jaycee-sb 相当）\n   =========================================================================== */\n\n.lom-sidebar {\n  display: flex;\n  flex-direction: column;\n  gap: 24px;\n}\n\n.lom-sb {\n  border: 1px solid var(--lom-border);\n  border-radius: var(--lom-radius);\n  overflow: hidden;\n  background: var(--lom-bg);\n}\n\n.lom-sb__title {\n  margin: 0;\n  padding: 10px 12px;\n  background: var(--lom-brand);\n  color: #fff;\n  font-size: 14px;\n  font-weight: 700;\n  text-align: center;\n  line-height: 1.4;\n}\n\n/* 件数は lomtheme_sidebar_count で絞ってあるので、高さ制限はかけない。\n   max-height でスクロールさせると最後の項目が中途半端に切れて壊れて見える。 */\n.lom-sb__list {\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n\n.lom-sb__item + .lom-sb__item {\n  border-top: 1px solid var(--lom-bg-muted);\n}\n\n.lom-sb__link {\n  display: grid;\n  grid-template-columns: 64px minmax(0, 1fr);\n  gap: 10px;\n  padding: 10px 12px;\n  color: inherit;\n  text-decoration: none;\n}\n\n.lom-sb__link:hover {\n  background: var(--lom-bg-muted);\n  text-decoration: none;\n}\n\n.lom-sb__thumb {\n  display: block;\n  width: 64px;\n  aspect-ratio: 1 / 1;\n  border-radius: 6px;\n  overflow: hidden;\n  background: var(--lom-bg-muted);\n}\n\n.lom-sb__thumb img {\n  width: 100%;\n  height: 100%;\n  object-fit: cover;\n}\n\n.lom-sb__main {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 4px;\n  min-width: 0;\n}\n\n.lom-sb__main .lom-date {\n  font-size: 11px;\n  color: var(--lom-text-muted);\n  line-height: 1;\n}\n\n.lom-sb__heading {\n  font-size: 12.5px;\n  font-weight: 700;\n  line-height: 1.5;\n  color: var(--lom-text);\n\n  /* 3行で打ち切る。タイトルが長い投稿でリストが崩れるのを防ぐ。 */\n  display: -webkit-box;\n  -webkit-line-clamp: 3;\n  -webkit-box-orient: vertical;\n  overflow: hidden;\n}\n\n.lom-sb__main .lom-badge {\n  font-size: 10px;\n  padding: 4px 7px;\n}\n\n/* ウィジェットエリア ------------------------------------------------------ */\n\n.lom-widget {\n  border: 1px solid var(--lom-border);\n  border-radius: var(--lom-radius);\n  padding: 16px;\n}\n\n.lom-widget__title {\n  margin: 0 0 12px;\n  font-size: 14px;\n  font-weight: 700;\n}\n\n\n\u003C/style\u003E\n\u003Cstyle\u003E\n/* ===========================================================================\n   フレキシブルコンテンツの各レイアウト\n\n   docs/03-page-layout-requirements.md の7種に対応。\n   =========================================================================== */\n\n.lom-blocks {\n  display: flex;\n  flex-direction: column;\n  gap: 40px;\n  padding-bottom: 56px;\n}\n\n/* 本文 ------------------------------------------------------------------- */\n\n.lom-prose {\n  font-size: 15px;\n  line-height: 1.9;\n  color: var(--lom-text);\n}\n\n.lom-prose \u003E :first-child { margin-top: 0; }\n.lom-prose \u003E :last-child { margin-bottom: 0; }\n\n.lom-prose p { margin-block: 0 1.2em; }\n.lom-prose a { text-decoration: underline; }\n\n.lom-prose ul,\n.lom-prose ol { padding-inline-start: 1.4em; margin-block: 0 1.2em; }\n\n.lom-prose img { margin-block: 1em; }\n\n.lom-prose--boxed {\n  border: 1px solid var(--lom-border);\n  border-radius: var(--lom-radius);\n  padding: 24px;\n  background: var(--lom-bg);\n}\n\n/* リード文 --------------------------------------------------------------- */\n\n.lom-lead {\n  margin: 0;\n  text-align: center;\n  font-size: clamp(17px, 2.4vw, 21px);\n  font-weight: 700;\n  line-height: 1.8;\n  color: var(--lom-heading);\n}\n\n/* ヒーロー画像 ----------------------------------------------------------- */\n\n.lom-hero {\n  margin: 0;\n  border-radius: var(--lom-radius);\n  overflow: hidden;\n  background: var(--lom-bg-muted);\n}\n\n.lom-hero img { width: 100%; }\n\n.lom-hero--wide img     { aspect-ratio: 16 / 9; object-fit: cover; }\n.lom-hero--standard img { aspect-ratio: 4 / 3;  object-fit: cover; }\n.lom-hero--portrait img { aspect-ratio: 3 / 4;  object-fit: cover; }\n.lom-hero--auto img     { aspect-ratio: auto; }\n\n.lom-hero__caption {\n  padding: 8px 4px 0;\n  font-size: 12px;\n  color: var(--lom-text-muted);\n  text-align: center;\n}\n\n/* 共通のセクション見出し --------------------------------------------------- */\n\n.lom-section__heading,\n.lom-info__heading {\n  font-size: clamp(18px, 2.6vw, 22px);\n  text-align: center;\n  margin-bottom: 20px;\n}\n\n/* セクション（見出し＋本文＋画像グリッド） ---------------------------------- */\n\n.lom-section {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 32px 28px;\n}\n\n.lom-section__body { margin-bottom: 22px; }\n\n.lom-gallery {\n  display: grid;\n  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));\n  gap: 12px;\n  list-style: none;\n  margin: 0;\n  padding: 0;\n}\n\n.lom-gallery__item {\n  border-radius: 6px;\n  overflow: hidden;\n  background: var(--lom-bg-muted);\n}\n\n.lom-gallery__item img {\n  width: 100%;\n  aspect-ratio: 4 / 3;\n  object-fit: cover;\n}\n\n.lom-section__caption {\n  margin: 16px 0 0;\n  padding: 10px 14px;\n  border: 1px solid var(--lom-border);\n  border-radius: 6px;\n  background: var(--lom-bg-muted);\n  font-size: 12.5px;\n  color: var(--lom-text-muted);\n}\n\n@media (max-width: 767px) {\n  .lom-section { padding: 22px 16px; }\n  /* 4列は狭すぎるので2列に落とす */\n  .lom-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n}\n\n/* カード（画像＋テキスト） -------------------------------------------------- */\n\n.lom-features {\n  display: flex;\n  flex-direction: column;\n  gap: 24px;\n}\n\n.lom-feature {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 28px;\n}\n\n.lom-feature__heading {\n  font-size: 18px;\n  text-align: center;\n  margin-bottom: 22px;\n  padding-bottom: 10px;\n  position: relative;\n}\n\n/* 見出し下の短いアクセント線 */\n.lom-feature__heading::after {\n  content: \"\";\n  position: absolute;\n  left: 50%;\n  bottom: 0;\n  transform: translateX(-50%);\n  width: 56px;\n  height: 2px;\n  background: var(--lom-brand);\n}\n\n.lom-feature__inner {\n  display: grid;\n  grid-template-columns: minmax(0, 240px) minmax(0, 1fr);\n  gap: 24px;\n  align-items: start;\n}\n\n.lom-feature--image-right .lom-feature__inner {\n  grid-template-columns: minmax(0, 1fr) minmax(0, 240px);\n}\n\n.lom-feature--image-right .lom-feature__media { order: 2; }\n\n.lom-feature__media img {\n  width: 100%;\n  border-radius: 6px;\n}\n\n@media (max-width: 767px) {\n  .lom-feature { padding: 20px 16px; }\n  .lom-feature__inner,\n  .lom-feature--image-right .lom-feature__inner {\n    grid-template-columns: minmax(0, 1fr);\n  }\n  .lom-feature--image-right .lom-feature__media { order: 0; }\n}\n\n/* 箇条書きボックス --------------------------------------------------------- */\n\n.lom-boxes {\n  display: grid;\n  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));\n  gap: 20px;\n}\n\n.lom-box {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 24px;\n}\n\n.lom-box__heading {\n  font-size: 16px;\n  text-align: center;\n  margin-bottom: 16px;\n  padding-bottom: 10px;\n  border-bottom: 2px solid var(--lom-brand);\n}\n\n.lom-box__list {\n  margin: 0;\n  padding-inline-start: 1.3em;\n  font-size: 14px;\n  line-height: 1.9;\n}\n\n@media (max-width: 767px) {\n  .lom-boxes { grid-template-columns: minmax(0, 1fr); }\n}\n\n/* 案内ボックス ------------------------------------------------------------ */\n\n.lom-info {\n  background: var(--lom-bg);\n  border-radius: var(--lom-radius);\n  box-shadow: var(--lom-shadow);\n  padding: 28px;\n}\n\n.lom-info__list {\n  margin: 0 0 18px;\n  padding-inline-start: 1.5em;\n  font-size: 14px;\n  line-height: 1.9;\n}\n\n.lom-info__note {\n  font-size: 14px;\n}\n\n@media (max-width: 767px) {\n  .lom-info { padding: 20px 16px; }\n}\n\n\u003C/style\u003E\n\u003C/head\u003E\n\n\u003Cbody class=\"page singular\"\u003E\u003Ca class=\"skip-link screen-reader-text\" href=\"#lom-content\"\u003E\n\tコンテンツにスキップ\u003C/a\u003E\n\n\u003Cheader class=\"lom-header\"\u003E\n\t\u003Cdiv class=\"lom-header__inner lom-container lom-container--wide\"\u003E\n\n\t\t\u003Cdiv class=\"lom-header__brand\"\u003E\n\t\t\t\t\t\t\t\u003Ca href=\"index.html\" class=\"custom-logo-link\"\u003E\u003Cimg class=\"custom-logo\" src=\"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22268%22%20height%3D%22122%22%20viewBox%3D%220%200%20268%20122%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20fill%3D%22hsl%28200%2042%25%2084%25%29%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20font-family%3D%22sans-serif%22%20font-size%3D%2213%22%20fill%3D%22hsl%28200%2038%25%2030%25%29%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22middle%22%3EJCI%20LOGO%3C%2Ftext%3E%3C%2Fsvg%3E\" alt=\"一般社団法人サンプル青年会議所\"\u003E\u003C/a\u003E\t\t\t\t\t\u003C/div\u003E\n\n\t\t\u003Cdiv class=\"lom-header__actions\"\u003E\n\t\t\t\t\t\t\t\u003Ca class=\"lom-header__cta\" href=\"page-join.html\"\u003E\n\t\t\t\t\t入会案内\t\t\t\t\u003C/a\u003E\n\t\t\t\n\t\t\t\u003Cbutton type=\"button\"\n\t\t\t        class=\"lom-header__toggle\"\n\t\t\t        aria-expanded=\"false\"\n\t\t\t        aria-controls=\"lom-drawer\
