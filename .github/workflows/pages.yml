name: サイトを GitHub Pages に公開

# html/ をそのまま公開する。ビルド工程は無い。
# 公開前に tools/check_html.py を通し、リンク切れや見出し構造の
# 崩れがあれば公開せずに落とす。

on:
  push:
    branches:
      - claude/jc-wordpress-theme-pl5zh5
    paths:
      - 'html/**'
      - 'tools/check_html.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 検査して固める
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HTMLを検査する
        run: python3 tools/check_html.py html/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
